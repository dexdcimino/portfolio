<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Inko</title>
<link rel="manifest" href="/inko/manifest.webmanifest">
<link rel="apple-touch-icon" href="/inko/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><circle cx='256' cy='256' r='168' fill='%2322d3ee'/><path d='M176 322 C 216 236, 296 348, 338 214' stroke='%230b0d12' stroke-width='46' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="/inko/app.css">
</head>
<body>
<div id="topbar">
  <input id="title-input" maxlength="24" placeholder="Untitled" autocomplete="off" spellcheck="false">
</div>

<div id="stage">
  <div id="canvas-frame">
    <canvas id="pad"></canvas>
  </div>
</div>

<div id="toolbar">
  <div class="tb-side">
    <button id="grid-btn" class="tbtn" aria-label="Gallery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <button id="sym-btn" class="tbtn" aria-label="Mirror" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="3" x2="12" y2="21" stroke-dasharray="3 3"/><path d="M8 8 L5 12 L8 16"/><path d="M16 8 L19 12 L16 16"/></svg>
    </button>
  </div>
  <div class="tb-mid">
    <button id="undo-btn" class="tbtn" aria-label="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 L4 9 L9 4"/><path d="M4 9 H14 A6 6 0 0 1 14 21 H9"/></svg>
    </button>
    <button id="plus-btn" aria-label="New canvas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button id="redo-btn" class="tbtn" aria-label="Redo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 14 L20 9 L15 4"/><path d="M20 9 H10 A6 6 0 0 0 10 21 H15"/></svg>
    </button>
  </div>
  <div class="tb-side right">
    <button id="eraser-btn" class="tbtn" aria-label="Eraser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21 L4 18 L14 8 L18 8 L20 10 L10 20 Z"/><path d="M14 8 L17 5 L21 9 L18 12"/></svg>
    </button>
    <button id="brush-btn" class="tbtn sel" aria-label="Brush">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15 L4 20 L4 20"/><path id="brush-tip" d="M14 4 L20 10 L11 19 L5 13 Z" fill="#ff2d2d"/><path d="M14 4 L17 2 L22 7 L20 10"/></svg>
    </button>
  </div>
</div>

<div id="brush-pop">
  <div id="bp-tabs">
    <button id="tab-brush" class="bp-tab on">Brush</button>
    <button id="tab-canvas" class="bp-tab">Canvas</button>
  </div>
  <div id="bp-head">
    <div id="swatch"></div>
    <span id="swatch-label">Brush color</span>
    <button id="pop-x" aria-label="Close">✕</button>
  </div>
  <div id="hsb-wrap">
    <div class="ctl"><div class="mrow"><span>Hue</span><span id="hue-v">4°</span></div>
      <input type="range" id="hue" min="0" max="360" value="4"></div>
    <div class="ctl"><div class="mrow"><span>Saturation</span><span id="sat-v">100</span></div>
      <input type="range" id="sat" min="0" max="100" value="100"></div>
    <div class="ctl"><div class="mrow"><span>Brightness</span><span id="bri-v">100</span></div>
      <input type="range" id="bri" min="0" max="100" value="100"></div>
  </div>
  <div class="ctl" id="ctl-size">
    <div class="mrow"><span id="size-title">Brush size</span><span id="size-v">45px</span></div>
    <input type="range" id="size" min="1" max="90" value="45">
    <div id="size-sync">Synced with brush size</div>
  </div>
</div>

<div id="size-preview"><div id="sp-circle"></div><div id="sp-label">45px</div></div>

<div id="gallery">
  <div id="g-head"><span>Gallery</span><span id="g-count"></span></div>
  <div id="g-grid"><div id="g-rows"></div></div>
  <div id="g-bar"><button id="g-back">‹ Back to canvas</button></div>
</div>

<div id="modal"><div id="modal-card">
  <div id="m-title"></div><div id="m-text"></div>
  <div class="mrow"><button id="m-cancel" class="mbtn">Cancel</button><button id="m-del" class="mbtn danger">Delete</button></div>
</div></div>

<div id="toast"></div>

<script src="/inko/app.js"></script>
</body>
</html>
