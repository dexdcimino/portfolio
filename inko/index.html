<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Inko</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230d1220'/><stop offset='1' stop-color='%231b2440'/></linearGradient><linearGradient id='ac' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2322d3ee'/><stop offset='1' stop-color='%23a78bfa'/></linearGradient></defs><rect width='512' height='512' fill='url(%23bg)'/><circle cx='256' cy='256' r='168' fill='url(%23ac)'/><path d='M176 322 C 216 236, 296 348, 338 214' stroke='%230b0d12' stroke-width='46' fill='none' stroke-linecap='round'/><circle cx='344' cy='196' r='25' fill='%230b0d12'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230d1220'/><stop offset='1' stop-color='%231b2440'/></linearGradient><linearGradient id='ac' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2322d3ee'/><stop offset='1' stop-color='%23a78bfa'/></linearGradient></defs><rect width='512' height='512' fill='url(%23bg)'/><circle cx='256' cy='256' r='168' fill='url(%23ac)'/><path d='M176 322 C 216 236, 296 348, 338 214' stroke='%230b0d12' stroke-width='46' fill='none' stroke-linecap='round'/><circle cx='344' cy='196' r='25' fill='%230b0d12'/></svg>">
<style>
:root{
  --bg:#0a0c11;
  --panel:rgba(20,24,33,.94);
  --border:rgba(255,255,255,.09);
  --text:#f2f4f8;
  --muted:#8b93a7;
  --a1:#22d3ee;
  --a2:#a78bfa;
  --danger:#ff453a;
}
html,body{height:100%;}
body{
  margin:0;
  background:radial-gradient(130% 90% at 50% -10%, #151b2b 0%, var(--bg) 55%) fixed, var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  height:100vh;height:100dvh;
  overflow:hidden;overscroll-behavior:none;
  display:flex;flex-direction:column;align-items:center;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
button{touch-action:manipulation;}
#topbar{
  width:100%;max-width:520px;flex:none;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 24px 6px;
  display:flex;align-items:center;justify-content:center;
}
#title-input{
  width:100%;text-align:center;background:transparent;border:none;outline:none;
  color:var(--text);font-size:21px;font-weight:700;letter-spacing:.2px;
}
#title-input::placeholder{color:var(--muted);font-weight:600;}
#stage{
  flex:1;width:100%;min-height:0;
  display:flex;align-items:center;justify-content:center;
  padding:4px 0;
}
#canvas-frame{
  border-radius:20px;overflow:hidden;background:#fff;line-height:0;
  border:1px solid #3d434f;
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 18px 50px rgba(0,0,0,.65),0 0 70px rgba(139,92,246,.14);
}
#pad{display:block;touch-action:none;background:#fff;}
#toolbar{
  flex:none;
  width:calc(100vw - 20px);max-width:600px;
  margin:6px 0 calc(env(safe-area-inset-bottom,0px) + 4px);
  display:flex;align-items:center;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:26px;padding:8px 10px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);
}
.tb-side{flex:1;display:flex;gap:4px;align-items:center;}
.tb-side.right{justify-content:flex-end;}
.tb-mid{display:flex;gap:4px;align-items:center;}
.tbtn{
  width:42px;height:42px;border-radius:50%;border:none;background:transparent;color:#e8ebf2;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
  transition:transform .12s,background .15s,opacity .15s,color .15s;
}
.tbtn:active{transform:scale(.92);background:rgba(255,255,255,.1);}
.tbtn:disabled{opacity:.28;}
.tbtn:disabled:active{transform:none;background:transparent;}
.tbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tbtn.sel{background:linear-gradient(135deg,var(--a1),var(--a2));color:#0b0d12;}
.tbtn.sel svg{stroke:#0b0d12;}
#brush-tip{fill:#ff453a;stroke:none;}
#sym-btn.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#0b0d12;}
#sym-btn.on svg{stroke:#0b0d12;}
#plus-btn{
  width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;flex:none;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(56,189,248,.35);
  transition:transform .12s;
}
#plus-btn:active{transform:scale(.9);}
#plus-btn svg{width:24px;height:24px;fill:none;stroke:#0b0d12;stroke-width:2.4;stroke-linecap:round;}
#brush-pop{
  position:fixed;left:50%;transform:translateX(-50%) translateY(8px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  width:min(92vw,340px);background:var(--panel);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:22px;padding:14px 18px 18px;z-index:60;
  box-shadow:0 18px 45px rgba(0,0,0,.55);
  display:none;opacity:0;transition:opacity .18s,transform .18s;
}
#brush-pop.open{display:block;opacity:1;transform:translateX(-50%) translateY(0);}
.bp-tabs{display:flex;background:rgba(255,255,255,.07);border-radius:14px;padding:3px;margin-bottom:14px;}
.bp-tab{
  flex:1;border:none;background:transparent;color:var(--muted);
  font-size:13px;font-weight:700;padding:8px;border-radius:11px;cursor:pointer;
  transition:background .15s,color .15s;
}
.bp-tab.on{background:rgba(255,255,255,.14);color:var(--text);}
.bp-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
#swatch{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:#ff453a;flex:none;}
.bp-head .t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;}
#pop-x{
  margin-left:auto;width:32px;height:32px;border-radius:50%;border:none;flex:none;
  background:rgba(255,255,255,.08);color:var(--text);font-size:17px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
#pop-x:active{transform:scale(.9);background:rgba(255,255,255,.16);}
.ctl{margin-bottom:12px;}
.ctl:last-child{margin-bottom:0;}
.ctl label{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.ctl label span{color:var(--text);}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:pointer;--sat-track:#888;--bri-track:#888;}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 2px 6px rgba(0,0,0,.45);border:none;}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 6px rgba(0,0,0,.45);}
#hue::-webkit-slider-runnable-track{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);}
#hue::-moz-range-track{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);}
#sat::-webkit-slider-runnable-track{background:var(--sat-track);}
#sat::-moz-range-track{background:var(--sat-track);}
#bri::-webkit-slider-runnable-track{background:var(--bri-track);}
#bri::-moz-range-track{background:var(--bri-track);}
#size::-webkit-slider-runnable-track{background:#3a4152;}
#size::-moz-range-track{background:#3a4152;}
#size-sync{display:none;font-size:11px;color:var(--muted);margin-top:4px;}
#size-sync.show{display:block;}
#size-preview{
  position:fixed;left:50%;transform:translateX(-50%);z-index:70;
  display:none;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
}
#size-preview.show{display:flex;}
#sp-circle{border-radius:50%;background:#ff453a;box-shadow:0 4px 14px rgba(0,0,0,.5);}
#sp-label{font-size:11px;font-weight:700;color:var(--muted);background:rgba(20,24,33,.9);padding:3px 10px;border-radius:999px;border:1px solid var(--border);}
#gallery{position:fixed;inset:0;background:#0a0c11;z-index:80;display:none;flex-direction:column;}
#gallery.open{display:flex;}
#g-head{flex:none;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 14px;border-bottom:1px solid rgba(255,255,255,.07);}
#g-head h2{margin:0;font-size:20px;font-weight:700;}
#g-head p{margin:3px 0 0;font-size:12px;color:var(--muted);}
#g-grid{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
#g-rows{min-height:100%;display:flex;flex-direction:column;padding:16px;box-sizing:border-box;}
#g-rows::before{content:'';flex:1 1 auto;}
.g-row{display:flex;flex-direction:row-reverse;gap:14px;margin-bottom:14px;}
.g-row:last-child{margin-bottom:0;}
.g-item{flex:0 0 calc((100% - 28px)/3);min-width:0;display:flex;flex-direction:column;gap:6px;}
.g-thumb{position:relative;aspect-ratio:3/4;border-radius:14px;background:#fff center/cover;border:1px solid rgba(255,255,255,.12);overflow:hidden;cursor:pointer;transition:transform .12s;}
.g-thumb:active{transform:scale(.97);}
.g-del{
  position:absolute;left:8px;bottom:8px;width:32px;height:32px;border-radius:10px;border:none;
  background:rgba(255,69,58,.95);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.45);
}
.g-del:active{transform:scale(.9);}
.g-del svg{width:15px;height:15px;stroke:#fff;stroke-width:3.2;stroke-linecap:round;}
.g-dl{
  position:absolute;left:8px;top:8px;width:32px;height:32px;border-radius:10px;border:none;
  background:rgba(16,19,26,.88);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.45);
}
.g-dl:active{transform:scale(.9);}
.g-dl svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.g-title{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;}
#g-bar{
  flex:none;width:calc(100vw - 20px);max-width:600px;
  margin:6px auto calc(env(safe-area-inset-bottom,0px) + 4px);
  display:flex;justify-content:center;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:26px;padding:10px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);
}
#g-back{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-width:min(70vw,280px);padding:13px 26px;border:none;border-radius:18px;cursor:pointer;
  background:linear-gradient(135deg,var(--a1),var(--a2));color:#0b0d12;
  font-size:15px;font-weight:700;
  transition:transform .12s;
}
#g-back:active{transform:scale(.96);}
#g-back svg{width:18px;height:18px;fill:none;stroke:#0b0d12;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(4,6,10,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:24px;}
#modal.open{display:flex;}
#modal-card{width:100%;max-width:320px;background:#171c26;border:1px solid var(--border);border-radius:22px;padding:22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);}
#modal-card h3{margin:0 0 8px;font-size:17px;}
#modal-card p{margin:0 0 18px;font-size:13.5px;color:var(--muted);line-height:1.55;}
.mrow{display:flex;gap:10px;}
.mbtn{flex:1;padding:12px;border-radius:14px;border:none;font-size:15px;font-weight:700;cursor:pointer;}
.mbtn:active{transform:scale(.97);}
#m-cancel{background:rgba(255,255,255,.09);color:var(--text);}
#m-del{background:var(--danger);color:#fff;}
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  background:#222836;border:1px solid var(--border);color:var(--text);
  font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:120;
  max-width:90vw;text-align:center;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
</head>
<body>

<div id="topbar">
  <input id="title-input" maxlength="24" placeholder="Untitled" autocomplete="off" autocapitalize="off" spellcheck="false">
</div>

<div id="stage">
  <div id="canvas-frame"><canvas id="pad"></canvas></div>
</div>

<div id="toolbar">
  <div class="tb-side">
    <button class="tbtn" id="grid-btn" title="Gallery" aria-label="Open gallery">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
    </button>
    <button class="tbtn" id="sym-btn" title="Mirror symmetry" aria-label="Toggle mirror symmetry" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M12 4v16" stroke-dasharray="3 2.4"/><path d="M8.5 8L5 12l3.5 4"/><path d="M15.5 8l3.5 4-3.5 4"/></svg>
    </button>
  </div>
  <div class="tb-mid">
    <button class="tbtn" id="undo-btn" title="Undo" aria-label="Undo">
      <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 016 6v2"/></svg>
    </button>
    <button id="plus-btn" title="New canvas" aria-label="New canvas">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tbtn" id="redo-btn" title="Redo" aria-label="Redo">
      <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 00-6 6v2"/></svg>
    </button>
  </div>
  <div class="tb-side right">
    <button class="tbtn" id="eraser-btn" title="Eraser" aria-label="Eraser">
      <svg viewBox="0 0 24 24"><path d="M10 20l-6-6L15 3l6 6-9 9h-2z"/><path d="M14.5 6.5l3 3"/></svg>
    </button>
    <button class="tbtn sel" id="brush-btn" title="Brush" aria-label="Brush settings">
      <svg viewBox="0 0 24 24"><path d="M15.2 4.2l4.6 4.6-8.4 8.4-4.6-4.6 8.4-8.4z"/><path id="brush-tip" d="M3 15.8l6.4 6.4c.6.6 1.7.1 1.4-.8l-1.9-5.2c-.2-.5-.6-.9-1.1-1.1l-5.2-1.9c-.9-.3-1.4.8-.6 1.6z"/></svg>
    </button>
  </div>
</div>

<div id="brush-pop" role="dialog" aria-label="Tool settings">
  <div class="bp-tabs" id="bp-tabs">
    <button class="bp-tab on" id="tab-brush">Brush</button>
    <button class="bp-tab" id="tab-canvas">Canvas</button>
  </div>
  <div class="bp-head">
    <div id="swatch"></div>
    <div class="t" id="swatch-label">Brush color</div>
    <button id="pop-x" aria-label="Close">✕</button>
  </div>
  <div id="hsb-wrap">
    <div class="ctl"><label>Hue <span id="hue-v">4°</span></label><input type="range" id="hue" min="0" max="360" value="4"></div>
    <div class="ctl"><label>Saturation <span id="sat-v">100%</span></label><input type="range" id="sat" min="0" max="100" value="100"></div>
    <div class="ctl"><label>Brightness <span id="bri-v">100%</span></label><input type="range" id="bri" min="0" max="100" value="100"></div>
  </div>
  <div class="ctl" id="ctl-size"><label><span id="size-title">Brush size</span> <span id="size-v">45px</span></label><input type="range" id="size" min="1" max="90" value="45"><div id="size-sync">Synced with brush size</div></div>
</div>

<div id="size-preview"><div id="sp-circle"></div><div id="sp-label">45px</div></div>

<div id="gallery" role="dialog" aria-label="Saved canvases">
  <div id="g-head">
    <div><h2>Gallery</h2><p id="g-count"></p></div>
  </div>
  <div id="g-grid"><div id="g-rows"></div></div>
  <div id="g-bar">
    <button id="g-back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Back to canvas</button>
  </div>
</div>

<div id="modal" role="alertdialog" aria-label="Confirm delete">
  <div id="modal-card">
    <h3 id="m-title">Delete this canvas?</h3>
    <p id="m-text">Are you sure you want to delete this canvas? This can't be undone.</p>
    <div class="mrow">
      <button class="mbtn" id="m-cancel">Cancel</button>
      <button class="mbtn" id="m-del">Delete</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
"use strict";
var W=880,H=1170;
var canvas=document.getElementById('pad');
var ctx=canvas.getContext('2d');
var DPR=Math.min(window.devicePixelRatio||1,2);
canvas.width=W*DPR;canvas.height=H*DPR;
ctx.setTransform(DPR,0,0,DPR,0,0);
ctx.lineCap='round';ctx.lineJoin='round';

var sLayer=document.createElement('canvas');
sLayer.width=W*DPR;sLayer.height=H*DPR;
var sctx=sLayer.getContext('2d');
sctx.setTransform(DPR,0,0,DPR,0,0);
sctx.lineCap='round';sctx.lineJoin='round';

var titleInput=document.getElementById('title-input');
var undoBtn=document.getElementById('undo-btn');
var redoBtn=document.getElementById('redo-btn');
var plusBtn=document.getElementById('plus-btn');
var brushBtn=document.getElementById('brush-btn');
var eraserBtn=document.getElementById('eraser-btn');
var symBtn=document.getElementById('sym-btn');
var brushPop=document.getElementById('brush-pop');
var brushTip=document.getElementById('brush-tip');
var swatch=document.getElementById('swatch');
var swatchLabel=document.getElementById('swatch-label');
var hueEl=document.getElementById('hue'),satEl=document.getElementById('sat'),
    briEl=document.getElementById('bri'),sizeEl=document.getElementById('size');
var bpTabs=document.getElementById('bp-tabs');
var hsbWrap=document.getElementById('hsb-wrap');
var ctlSize=document.getElementById('ctl-size');
var sizePreview=document.getElementById('size-preview');
var spCircle=document.getElementById('sp-circle');
var spLabel=document.getElementById('sp-label');
var galleryEl=document.getElementById('gallery'),gGrid=document.getElementById('g-grid'),
    gRows=document.getElementById('g-rows'),gCount=document.getElementById('g-count');
var modal=document.getElementById('modal');
var toastEl=document.getElementById('toast');

var hue=4,sat=100,bri=100,brushSize=45,eraserSize=null;
var bgH=0,bgS=0,bgB=100;
var panelMode='brush';
var popMode=null;
var tool='brush';
var mirrorOn=false;
var drawing=false,last=null,midPrev=null;
var history=[],step=-1;
var dirty=false,editingId=null,pendingDelete=null;
var gallery=[];
try{
  var raw=JSON.parse(localStorage.getItem('sketchGalleryV1'))||[];
  gallery=raw.map(function(it){
    if(it.strokes||it.baked)return it;
    return {id:it.id,title:it.title,bg:{h:0,s:0,b:100},strokes:null,baked:it.data,ts:it.ts};
  });
}catch(e){gallery=[];}
if(!Array.isArray(gallery))gallery=[];

function hsbToCss(h,s,b,a){
  if(a===undefined)a=1;
  s/=100;b/=100;
  var l=b*(1-s/2),sl=0;
  if(l>0&&l<1)sl=(b-l)/Math.min(l,1-l);
  return 'hsla('+h+','+(sl*100).toFixed(1)+'%,'+(l*100).toFixed(1)+'%,'+a+')';
}
function brushCss(){return hsbToCss(hue,sat,bri,1);}
function bgCss(){return hsbToCss(bgH,bgS,bgB,1);}
function activeSize(){return tool==='eraser'?eraserEff():brushSize;}
function eraserEff(){return eraserSize===null?brushSize:eraserSize;}

var toastT=null;
function toast(msg){
  toastEl.textContent=msg;toastEl.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('show');},2200);
}
function clearMain(){
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);ctx.restore();
}
function clearStrokes(){
  sctx.save();sctx.setTransform(1,0,0,1,0,0);
  sctx.clearRect(0,0,sLayer.width,sLayer.height);sctx.restore();
}
function render(){
  clearMain();
  ctx.fillStyle=bgCss();ctx.fillRect(0,0,W,H);
  ctx.drawImage(sLayer,0,0,W,H);
  if(mirrorOn){
    ctx.save();
    ctx.strokeStyle='rgba(120,130,150,.4)';ctx.lineWidth=2;ctx.setLineDash([9,9]);
    ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
    ctx.restore();
  }
}
function clearCanvas(){
  clearStrokes();render();
  history=[];step=-1;pushHistory();
}
function fit(){
  var top=document.getElementById('topbar').offsetHeight;
  var tb=document.getElementById('toolbar').offsetHeight;
  var availW=Math.min(window.innerWidth*0.94,460);
  var availH=window.innerHeight-top-tb-36;
  var k=Math.min(availW/W,availH/H);
  if(k<=0)k=0.2;
  canvas.style.width=(W*k)+'px';canvas.style.height=(H*k)+'px';
}
window.addEventListener('resize',function(){fit();if(popMode)placePop();});
window.addEventListener('orientationchange',function(){setTimeout(function(){fit();if(popMode)placePop();},120);});

function syncUndoRedo(){undoBtn.disabled=step<=0;redoBtn.disabled=step>=history.length-1;}
function pushHistory(){
  step++;
  if(step<history.length)history.length=step;
  history.push(sLayer.toDataURL('image/png'));
  if(history.length>25){history.shift();step--;}
  syncUndoRedo();
}
function restoreStrokes(url){
  var img=new Image();
  img.onload=function(){
    clearStrokes();
    sctx.drawImage(img,0,0,W,H);
    render();
  };
  img.src=url;
}
undoBtn.addEventListener('click',function(){
  if(step>0){step--;restoreStrokes(history[step]);dirty=true;scheduleDraft();syncUndoRedo();}
});
redoBtn.addEventListener('click',function(){
  if(step<history.length-1){step++;restoreStrokes(history[step]);dirty=true;scheduleDraft();syncUndoRedo();}
});
symBtn.addEventListener('click',function(){
  mirrorOn=!mirrorOn;
  symBtn.classList.toggle('on',mirrorOn);
  symBtn.setAttribute('aria-pressed',mirrorOn?'true':'false');
  render();
});

function pt(e){
  var r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};
}
function applyTool(){
  if(tool==='eraser'){
    sctx.globalCompositeOperation='destination-out';
    sctx.strokeStyle='rgba(0,0,0,1)';sctx.fillStyle='rgba(0,0,0,1)';
    sctx.lineWidth=eraserEff();
  }else{
    sctx.globalCompositeOperation='source-over';
    sctx.strokeStyle=brushCss();sctx.fillStyle=brushCss();
    sctx.lineWidth=brushSize;
  }
}
function dot(x,y){
  var r=activeSize()/2;
  sctx.beginPath();sctx.arc(x,y,r,0,Math.PI*2);sctx.fill();
  if(mirrorOn){sctx.beginPath();sctx.arc(W-x,y,r,0,Math.PI*2);sctx.fill();}
}
function seg(ax,ay,bx,by,cx,cy){
  sctx.beginPath();sctx.moveTo(ax,ay);sctx.quadraticCurveTo(bx,by,cx,cy);sctx.stroke();
  if(mirrorOn){
    sctx.beginPath();sctx.moveTo(W-ax,ay);sctx.quadraticCurveTo(W-bx,by,W-cx,cy);sctx.stroke();
  }
}
canvas.addEventListener('pointerdown',function(e){
  if(popMode){closePop();e.preventDefault();return;}
  e.preventDefault();
  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  drawing=true;
  var p=pt(e);last=p;midPrev=p;
  applyTool();
  dot(p.x,p.y);render();
});
canvas.addEventListener('pointermove',function(e){
  if(!drawing)return;
  e.preventDefault();
  var p=pt(e);
  applyTool();
  var mid={x:(last.x+p.x)/2,y:(last.y+p.y)/2};
  seg(midPrev.x,midPrev.y,last.x,last.y,mid.x,mid.y);
  render();
  midPrev=mid;last=p;
});
function endStroke(){
  if(!drawing)return;
  drawing=false;
  sctx.globalCompositeOperation='source-over';
  pushHistory();dirty=true;scheduleDraft();
}
canvas.addEventListener('pointerup',endStroke);
canvas.addEventListener('pointercancel',endStroke);
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('touchstart',function(e){
  if(!popMode)return;
  var x=e.touches[0].clientX;
  if(x<28||x>window.innerWidth-28)closePop();
},{passive:true});

function snapshotStrokes(){return sLayer.toDataURL('image/png');}
function persist(){
  try{localStorage.setItem('sketchGalleryV1',JSON.stringify(gallery));}
  catch(e){toast('Storage is full — delete some canvases.');}
}
function saveCurrent(){
  var title=titleInput.value.trim()||'Untitled';
  var item={id:editingId||('c'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36)),
            title:title,bg:{h:bgH,s:bgS,b:bgB},strokes:snapshotStrokes(),ts:Date.now()};
  if(editingId){
    var idx=-1;
    for(var i=0;i<gallery.length;i++){if(gallery[i].id===editingId){idx=i;break;}}
    if(idx>=0)gallery[idx]=item;else gallery.unshift(item);
  }else{
    gallery.unshift(item);
  }
  editingId=item.id;
  if(gallery.length>20)gallery.length=20;
  persist();dirty=false;
}
plusBtn.addEventListener('click',function(){
  closePop();
  if(dirty){saveCurrent();toast('Canvas saved');}
  editingId=null;titleInput.value='';
  bgH=0;bgS=0;bgB=100;
  clearCanvas();dirty=false;
  try{localStorage.removeItem('sketchDraftV1');}catch(e){}
});

function thumbFor(it,cb){
  var t=document.createElement('canvas');
  t.width=360;t.height=480;
  var c=t.getContext('2d');
  if(it.strokes){
    var bg=it.bg||{h:0,s:0,b:100};
    c.fillStyle=hsbToCss(bg.h,bg.s,bg.b,1);c.fillRect(0,0,t.width,t.height);
    var img=new Image();
    img.onload=function(){
      c.drawImage(img,0,0,t.width,t.height);
      cb(t.toDataURL('image/jpeg',0.82));
    };
    img.src=it.strokes;
  }else if(it.baked){
    cb(it.baked);
  }else{
    c.fillStyle='#fff';c.fillRect(0,0,t.width,t.height);
    cb(t.toDataURL('image/jpeg',0.82));
  }
}
function liveThumb(cb){
  var t=document.createElement('canvas');
  t.width=360;t.height=480;
  var c=t.getContext('2d');
  c.fillStyle=bgCss();c.fillRect(0,0,t.width,t.height);
  c.drawImage(sLayer,0,0,sLayer.width,sLayer.height,0,0,t.width,t.height);
  cb(t.toDataURL('image/jpeg',0.82));
}
function fileName(title){
  var s=(title||'untitled').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  if(!s)s='canvas';
  return 'inko-'+s+'.png';
}
function downloadItem(it,isLive){
  var t=document.createElement('canvas');t.width=W;t.height=H;
  var c=t.getContext('2d');
  var done=function(){
    var a=document.createElement('a');
    a.href=t.toDataURL('image/png');
    a.download=fileName(it.title);
    document.body.appendChild(a);a.click();a.remove();
    toast('Downloaded');
  };
  if(isLive){
    c.fillStyle=bgCss();c.fillRect(0,0,W,H);
    c.drawImage(sLayer,0,0,W,H);
    done();
  }else if(it.strokes){
    var bg=it.bg||{h:0,s:0,b:100};
    c.fillStyle=hsbToCss(bg.h,bg.s,bg.b,1);c.fillRect(0,0,W,H);
    var img=new Image();
    img.onload=function(){c.drawImage(img,0,0,W,H);done();};
    img.src=it.strokes;
  }else if(it.baked){
    var img2=new Image();
    img2.onload=function(){c.drawImage(img2,0,0,W,H);done();};
    img2.src=it.baked;
  }
}
function makeItem(it,isLive,thumbUrl){
  var wrap=document.createElement('div');wrap.className='g-item';
  var th=document.createElement('div');th.className='g-thumb';
  if(thumbUrl)th.style.backgroundImage='url('+thumbUrl+')';
  var dl=document.createElement('button');dl.className='g-dl';dl.setAttribute('aria-label','Download canvas');
  dl.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>';
  dl.addEventListener('click',function(e){e.stopPropagation();downloadItem(it,isLive);});
  th.appendChild(dl);
  var btn=document.createElement('button');btn.className='g-del';
  btn.innerHTML='<svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14"/></svg>';
  if(isLive){
    btn.setAttribute('aria-label','Clear canvas');
    btn.addEventListener('click',function(e){e.stopPropagation();
      openModal('Clear canvas?','Are you sure you want to clear this canvas? This can\'t be undone.','Clear',function(){
        clearCanvas();dirty=false;
        try{localStorage.removeItem('sketchDraftV1');}catch(e){}
        renderGallery();toast('Canvas cleared');
      });
    });
    th.addEventListener('click',function(){galleryEl.classList.remove('open');});
  }else{
    btn.setAttribute('aria-label','Delete canvas');
    btn.addEventListener('click',function(e){e.stopPropagation();
      openModal('Delete this canvas?','Are you sure you want to delete this canvas? This can\'t be undone.','Delete',function(){
        gallery=gallery.filter(function(g){return g.id!==it.id;});
        if(editingId===it.id)editingId=null;
        persist();renderGallery();toast('Canvas deleted');
      });
    });
    th.addEventListener('click',function(){openCanvas(it.id);});
  }
  th.appendChild(btn);
  var cap=document.createElement('div');cap.className='g-title';cap.textContent=it.title||'Untitled';
  wrap.appendChild(th);wrap.appendChild(cap);
  return {wrap:wrap,thumb:th};
}
function renderGallery(){
  gRows.innerHTML='';
  gCount.textContent=gallery.length?(gallery.length+(gallery.length===1?' canvas':' canvases')):'';
  var liveTitle=titleInput.value.trim()||'Untitled';
  liveThumb(function(liveUrl){
    var items=[{id:'__live',title:liveTitle,live:true,thumb:liveUrl}];
    for(var i=0;i<gallery.length;i++)items.push(gallery[i]);
    var rows=[];
    for(var j=0;j<items.length;j+=3)rows.push(items.slice(j,j+3));
    rows.reverse().forEach(function(chunk){
      var row=document.createElement('div');row.className='g-row';
      chunk.forEach(function(it){
        var made=makeItem(it,it.live,it.live?it.thumb:null);
        row.appendChild(made.wrap);
        if(!it.live)thumbFor(it,function(url){made.thumb.style.backgroundImage='url('+url+')';});
      });
      gRows.appendChild(row);
    });
    gGrid.scrollTop=gGrid.scrollHeight;
  });
}
function openCanvas(id){
  if(id==='__live'){galleryEl.classList.remove('open');return;}
  var it=null;
  for(var i=0;i<gallery.length;i++){if(gallery[i].id===id){it=gallery[i];break;}}
  if(!it)return;
  if(dirty)saveCurrent();
  var apply=function(){
    editingId=id;
    titleInput.value=(it.title&&it.title!=='Untitled')?it.title:'';
    history=[];step=-1;pushHistory();dirty=false;
    galleryEl.classList.remove('open');
    try{localStorage.removeItem('sketchDraftV1');}catch(e){}
  };
  if(it.strokes){
    var bg=it.bg||{h:0,s:0,b:100};
    bgH=bg.h;bgS=bg.s;bgB=bg.b;
    var img=new Image();
    img.onload=function(){
      clearStrokes();
      sctx.drawImage(img,0,0,W,H);
      render();apply();refreshPanelUI();
    };
    img.src=it.strokes;
  }else if(it.baked){
    bgH=0;bgS=0;bgB=100;
    var img2=new Image();
    img2.onload=function(){
      clearStrokes();
      sctx.drawImage(img2,0,0,W,H);
      render();apply();refreshPanelUI();
    };
    img2.src=it.baked;
  }
}
document.getElementById('grid-btn').addEventListener('click',function(){
  closePop();renderGallery();galleryEl.classList.add('open');
});
document.getElementById('g-back').addEventListener('click',function(){
  galleryEl.classList.remove('open');
});
var modalConfirm=null;
function openModal(title,text,confirmLabel,onConfirm){
  document.getElementById('m-title').textContent=title;
  document.getElementById('m-text').textContent=text;
  document.getElementById('m-del').textContent=confirmLabel;
  modalConfirm=onConfirm;
  modal.classList.add('open');
}
document.getElementById('m-cancel').addEventListener('click',function(){
  modal.classList.remove('open');modalConfirm=null;
});
document.getElementById('m-del').addEventListener('click',function(){
  modal.classList.remove('open');
  var fn=modalConfirm;modalConfirm=null;
  if(fn)fn();
});

function closePop(){
  popMode=null;
  brushPop.classList.remove('open');
  hideSizePreview();
}
function placePop(){
  var tb=document.getElementById('toolbar');
  var r=tb.getBoundingClientRect();
  brushPop.style.bottom=Math.max(8,Math.round(window.innerHeight-r.top+12))+'px';
}
function syncToolSel(){
  brushBtn.classList.toggle('sel',tool==='brush');
  eraserBtn.classList.toggle('sel',tool==='eraser');
}
function openBrushPop(){
  popMode='brush';
  bpTabs.style.display='';
  hsbWrap.style.display='';
  swatch.style.display='';
  syncTabs();refreshPanelUI();
  brushPop.classList.add('open');
  placePop();syncSizeNote();
}
function openEraserPop(){
  popMode='eraser';
  bpTabs.style.display='none';
  hsbWrap.style.display='none';
  swatch.style.display='none';
  swatchLabel.textContent='Eraser';
  sizeEl.value=eraserEff();
  document.getElementById('size-title').textContent='Eraser size';
  document.getElementById('size-v').textContent=eraserEff()+'px';
  brushPop.classList.add('open');
  placePop();syncSizeNote();
}
brushBtn.addEventListener('click',function(e){
  e.stopPropagation();
  if(popMode==='brush'){closePop();return;}
  tool='brush';syncToolSel();openBrushPop();
});
eraserBtn.addEventListener('click',function(e){
  e.stopPropagation();
  if(popMode==='eraser'){closePop();return;}
  tool='eraser';syncToolSel();openEraserPop();
});
document.getElementById('pop-x').addEventListener('click',function(){closePop();});
document.addEventListener('pointerdown',function(e){
  if(popMode&&!brushPop.contains(e.target)&&!brushBtn.contains(e.target)&&!eraserBtn.contains(e.target))closePop();
});
var tabBrush=document.getElementById('tab-brush'),tabCanvas=document.getElementById('tab-canvas');
tabBrush.addEventListener('click',function(){panelMode='brush';syncTabs();refreshPanelUI();});
tabCanvas.addEventListener('click',function(){panelMode='canvas';syncTabs();refreshPanelUI();});
function syncTabs(){
  tabBrush.classList.toggle('on',panelMode==='brush');
  tabCanvas.classList.toggle('on',panelMode==='canvas');
  swatchLabel.textContent=panelMode==='brush'?'Brush color':'Canvas color';
  ctlSize.style.display=panelMode==='brush'?'':'none';
}
function refreshPanelUI(){
  var h,s,b;
  if(panelMode==='brush'){h=hue;s=sat;b=bri;}else{h=bgH;s=bgS;b=bgB;}
  hueEl.value=h;satEl.value=s;briEl.value=b;
  sizeEl.value=(popMode==='eraser')?eraserEff():brushSize;
  var css=hsbToCss(h,s,b,1);
  swatch.style.background=css;
  brushTip.style.fill=brushCss();
  document.getElementById('hue-v').textContent=h+'°';
  document.getElementById('sat-v').textContent=s+'%';
  document.getElementById('bri-v').textContent=b+'%';
  document.getElementById('size-v').textContent=((popMode==='eraser')?eraserEff():brushSize)+'px';
  satEl.style.setProperty('--sat-track','linear-gradient(to right,'+hsbToCss(h,0,b)+','+hsbToCss(h,100,b)+')');
  briEl.style.setProperty('--bri-track','linear-gradient(to right,'+hsbToCss(h,s,0)+','+hsbToCss(h,s,100)+')');
}
hueEl.addEventListener('input',function(){
  var v=+hueEl.value;
  if(panelMode==='brush')hue=v;else bgH=v;
  if(panelMode==='canvas'){render();dirty=true;scheduleDraft();}
  refreshPanelUI();
});
satEl.addEventListener('input',function(){
  var v=+satEl.value;
  if(panelMode==='brush')sat=v;else bgS=v;
  if(panelMode==='canvas'){render();dirty=true;scheduleDraft();}
  refreshPanelUI();
});
briEl.addEventListener('input',function(){
  var v=+briEl.value;
  if(panelMode==='brush')bri=v;else bgB=v;
  if(panelMode==='canvas'){render();dirty=true;scheduleDraft();}
  refreshPanelUI();
});
var spHideT=null;
function showSizePreview(){
  var sz=activeSize();
  var d=Math.min(sz,150);
  spCircle.style.width=d+'px';spCircle.style.height=d+'px';
  if(popMode==='eraser'){
    spCircle.style.background='#fff';
    spCircle.style.border='2px dashed #8b93a7';
  }else{
    spCircle.style.background=brushCss();
    spCircle.style.border='none';
  }
  spLabel.textContent=sz+'px';
  var r=brushPop.getBoundingClientRect();
  sizePreview.style.bottom=(window.innerHeight-r.top+16)+'px';
  sizePreview.classList.add('show');
  clearTimeout(spHideT);
  spHideT=setTimeout(hideSizePreview,1400);
}
function hideSizePreview(){
  sizePreview.classList.remove('show');
  clearTimeout(spHideT);
}
sizeEl.addEventListener('input',function(){
  var v=+sizeEl.value;
  if(popMode==='eraser')eraserSize=v;else brushSize=v;
  document.getElementById('size-v').textContent=v+'px';
  syncSizeNote();
  showSizePreview();
});
function syncSizeNote(){
  var note=document.getElementById('size-sync');
  if(note)note.classList.toggle('show',popMode==='eraser'&&eraserSize===null);
  var t=document.getElementById('size-title');
  if(t)t.textContent=popMode==='eraser'?'Eraser size':'Brush size';
}

var draftT=null;
function writeDraft(){
  try{localStorage.setItem('sketchDraftV1',JSON.stringify({title:titleInput.value,bg:{h:bgH,s:bgS,b:bgB},strokes:snapshotStrokes()}));}catch(e){}
}
function scheduleDraft(){clearTimeout(draftT);draftT=setTimeout(writeDraft,600);}
titleInput.addEventListener('input',function(){dirty=true;scheduleDraft();});
document.addEventListener('visibilitychange',function(){if(document.hidden&&dirty)writeDraft();});

fit();syncTabs();refreshPanelUI();syncToolSel();
(function init(){
  var d=null;
  try{d=JSON.parse(localStorage.getItem('sketchDraftV1'));}catch(e){}
  if(d&&d.strokes){
    var bg=d.bg||{h:0,s:0,b:100};
    bgH=bg.h;bgS=bg.s;bgB=bg.b;
    titleInput.value=d.title||'';
    var img=new Image();
    img.onload=function(){
      clearStrokes();
      sctx.drawImage(img,0,0,W,H);
      render();
      history=[];step=-1;pushHistory();dirty=true;syncUndoRedo();refreshPanelUI();
    };
    img.src=d.strokes;
  }else{
    clearCanvas();
  }
  syncUndoRedo();
})();
})();
</script>
</body>
</html>
