<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YapTap — Talk. It types.</title>
<meta name="description" content="A floating voice-to-text bubble. Tap it, talk, and YapTap transcribes live while you review anything else.">
<meta name="theme-color" content="#070907">
<link rel="icon" href="icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YapTap">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LIVE CAPTION: one line across the top, words slide in smoothly in the accent color -->
<div id="caption" class="caption idle" aria-hidden="true">
  <span class="cap-dot"></span>
  <div class="cap-scroll" id="capScroll"><span id="capText">Tap the bubble and just talk…</span></div>
</div>

<main id="home">
  <header class="topbar">
    <img class="brand-icon" src="icon-512.png" alt="">
    <div class="brand-name">YapTap</div>
    <div class="brand-sub">talk · it types</div>
    <span class="brand-spacer"></span>
    <button id="installBtn" class="ctl-btn small ghost" type="button">Install app</button>
  </header>

  <!-- THE DRAFT, the phone app's "Current note (not saved yet)" panel:
       only ever on screen while an uncommitted draft exists. The words
       themselves autosave into the newest note below as they land. -->
  <div id="draftBanner" class="draft-banner hidden"></div>

  <!-- NOTES: the home view, exactly like the phone app — the list IS the
       screen, bare cards on the background, no container panel, no
       heading. Trash left, copy right, pencil for the name, tap the
       middle to expand; the body opens ABOVE the header. Oldest at the
       top, newest at the bottom by the thumb; the list grows upward. -->
  <div id="listScroll" class="list-scroll">
    <div id="listItems"></div>
    <p id="listEmpty" class="list-empty">No notes yet</p>
  </div>

  <!-- SELECTION WINDOW (v1.7, Inko's floating popup): an OVERLAY —
       it floats over the list, so appearing never moves a single note.
       Opens halfway up the screen, placed beside the held card and
       never over it; drags by its head; two actions only, Copy and
       Delete. Rendered visible by app.js (class .open). -->
  <div id="selPop" role="dialog" aria-label="Selected notes">
    <div id="selPopHead"><span id="selPopTitle"></span><button id="selPopX" type="button" aria-label="Done selecting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="7" y1="7" x2="17" y2="17"/><line x1="17" y1="7" x2="7" y2="17"/></svg></button></div>
    <div id="selPopGrid">
      <button id="selPopCopy" class="sel-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 5.5V5A1.5 1.5 0 0 0 14 3.5H5A1.5 1.5 0 0 0 3.5 5v9A1.5 1.5 0 0 0 5 15.5h.5"/></svg><span>Copy</span></button>
      <button id="selPopTrash" class="sel-btn danger" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6 7l1 13h10l1-13"/></svg><span>Delete</span></button>
    </div>
  </div>

  <!-- every control lives in the bottom thumb zone (v1.7): ONE row —
       Sign in far left (the account email when signed in), the in-app
       record pill centre (the logo, wearing the wave while it records),
       the bubble toggle right. The checkmark status line and the wordy
       account-state line are gone; Install moved up beside the brand. -->
  <section class="controls">
    <div class="controls-row">
      <button id="acctBtn" class="ctl-btn small" type="button"><span id="acctBtnLabel">Sign in</span></button>
      <div class="record-wrap" id="recordWrap">
        <button id="recordPill" class="record-pill" type="button" aria-label="Record a note in the app"></button>
        <canvas id="recordWave" class="record-wave" width="176" height="176"></canvas>
        <img id="recordFace" class="record-face" src="icon-512.png" alt="">
      </div>
      <button id="bubbleBtn" class="ctl-btn accent" type="button">
        <svg viewBox="0 0 24 24" class="ic"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>
        <span id="bubbleBtnLabel">Hide bubble</span>
      </button>
    </div>
  </section>
</main>

<!-- FLOATING BUBBLE: the app's face, exactly like the phone's bubble.
     Draggable, snaps to the nearest edge; while it records it wears the
     red sine wave and its heart glows — the state lives in the wave and
     the caption, never in swapped glyphs. -->
<div id="bubble" class="bubble at-right">
  <div id="opts" class="opts hidden">
    <button class="opt-btn" id="optNotes" type="button" aria-label="Go to the notes list">
      <svg viewBox="0 0 24 24" class="ic"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Notes</span>
    </button>
    <button class="opt-btn" id="optCopy" type="button" aria-label="Copy latest note">
      <svg viewBox="0 0 24 24" class="ic"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy</span>
    </button>
    <button class="opt-btn" id="optSave" type="button" aria-label="Finish this note and start a new one">
      <svg viewBox="0 0 24 24" class="ic"><path d="M20 6 9 17l-5-5"/></svg><span>Save</span>
    </button>
    <button class="opt-btn" id="optClose" type="button" aria-label="Hide the bubble">
      <svg viewBox="0 0 24 24" class="ic"><path d="M18 6 6 18M6 6l12 12"/></svg><span>Close</span>
    </button>
  </div>
  <button id="bubbleMain" class="bubble-main" type="button" aria-label="Record or pause">
    <img class="bubble-face" src="icon-512.png" alt="">
  </button>
  <!-- RECORDING WAVE: a sine wave wrapped around the bubble, drawn on this
       canvas while recording (app.js startWave). The canvas is bigger than
       the bubble and the wave's geometry is budgeted to fit inside it at
       maximum extent — nothing ever clips. -->
  <canvas id="bubbleWave" class="bubble-wave hidden" width="88" height="88" aria-hidden="true"></canvas>
  <button id="bubbleNub" class="bubble-nub" type="button" aria-label="Options">•••</button>
</div>

<!-- DELETE CONFIRM (v1.7): Inko's modal — a centred rounded card on a
     dim scrim, title, a line, Cancel / Delete. -->
<div id="delModal" class="del-modal hidden" role="alertdialog" aria-modal="true">
  <div class="del-card">
    <div id="delTitle">Delete note?</div>
    <div id="delText">It will be permanently deleted.</div>
    <div class="del-row">
      <button id="delCancel" class="del-btn" type="button">Cancel</button>
      <button id="delGo" class="del-btn danger" type="button">Delete</button>
    </div>
  </div>
</div>

<!-- ACCOUNT: the site's ONE sign-in, presented the site's way — the same
     card the main site and DexNote show (logo, title, two lines, then
     each provider as its mark and its name; email is the fourth way in
     and opens its form in the same column). The account itself is
     /account/site-auth.js, the module every app on dexcimino.com loads.
     Signed in, notes sync under the account; signed out, everything
     stays on this device. -->
<div id="acctSheet" class="acct-scrim hidden" role="dialog" aria-modal="true">
  <div class="acct-card">
    <div class="acct-handle"></div>
    <button class="acct-x" id="acctClose" type="button" aria-label="Close">✕</button>
    <div id="acctOut">
      <img class="si-logo" src="icon-512.png" alt="">
      <h3 class="si-title">Sign in</h3>
      <p class="si-note"><span>Your notes, on every device.</span><span>Sign in and they follow you.</span></p>
      <div id="acctProviders" class="si-providers">
        <button class="acct-provider si-provider is-primary" data-provider="google" type="button" aria-label="Sign in with Google"><span class="si-label"><span class="si-mark" data-provider="google" aria-hidden="true"></span>Google</span></button>
        <button class="acct-provider si-provider" data-provider="discord" type="button" aria-label="Sign in with Discord"><span class="si-label"><span class="si-mark" data-provider="discord" aria-hidden="true"></span>Discord</span></button>
        <button class="acct-provider si-provider" data-provider="github" type="button" aria-label="Sign in with GitHub"><span class="si-label"><span class="si-mark" data-provider="github" aria-hidden="true"></span>GitHub</span></button>
        <button id="acctEmailWay" class="si-provider is-quiet" type="button"><span class="si-label">Email</span></button>
      </div>
      <form id="acctForm" class="si-form hidden">
        <input id="acctEmail" class="si-input" type="email" placeholder="Email" autocomplete="email" autocapitalize="none" spellcheck="false">
        <input id="acctPass" class="si-input" type="password" placeholder="Password" autocomplete="current-password">
        <div class="si-form-row">
          <button id="acctSignIn" class="si-btn is-primary" type="submit">Sign in</button>
          <button id="acctCreate" class="si-btn" type="button">Create account</button>
        </div>
        <button id="acctReset" class="si-link" type="button">Forgot password?</button>
        <button id="acctBack" class="si-link" type="button">← All sign-in options</button>
      </form>
      <p id="acctMsg" class="si-error"></p>
      <div class="si-foot">
        <button id="acctNotNow" class="si-btn" type="button">Not now</button>
      </div>
    </div>
    <div id="acctIn" class="hidden">
      <img class="si-logo" src="icon-512.png" alt="">
      <h3 class="si-title" id="acctName">Signed in</h3>
      <p class="si-note"><span id="acctDetail"></span><span id="acctSyncState">Your notes sync to this account.</span></p>
      <div class="si-foot">
        <button id="acctSignOut" class="si-btn is-danger" type="button">Sign out</button>
        <button id="acctDone" class="si-btn" type="button">Done</button>
      </div>
      <p class="si-error" id="acctMsg2"></p>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
