<!-- SCRIPTS ARE FILES NOW, so script-src is 'self' with no 'unsafe-inline'.
     'wasm-unsafe-eval' is the price of compressed GLBs: the Draco, Meshopt and
     KTX2 decoders are WebAssembly. connect-src 'self' lets the decoders fetch
     themselves from decoders/; a MODEL still cannot reach the network, because
     every URL it names is rewritten to a local blob or an empty data: URI. -->

<style>

.card-x{position:absolute;top:10px;right:10px;width:32px;height:32px;padding:0;font-size:22px;line-height:1;background:transparent;border:0;color:var(--muted)}.card-x:hover{background:#ffffff14;color:#fff}
#loading{display:flex;align-items:center;gap:16px;text-align:left;padding:18px 20px}#loading[hidden]{display:none}#loading>div:nth-child(2){flex:1;min-width:0}#loading strong{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#loading span{color:var(--muted);font-size:13px}

</style>
</head><body>
<header><h1>MOBIUS 3D</h1><div id="overlay"><div id="filename"></div><div id="stats"></div></div><div class="header-actions"><button id="toggle-controls" aria-controls="controls-panel" aria-expanded="true">Controls</button><button id="sample-toggle" type="button" aria-pressed="true" title="Show the sample model"><svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 5.1C7.2 5.1 3.5 7.8 1.4 12c2.1 4.2 5.8 6.9 10.6 6.9s8.5-2.7 10.6-6.9C20.5 7.8 16.8 5.1 12 5.1Zm0 11.2a4.3 4.3 0 1 1 0-8.6 4.3 4.3 0 0 1 0 8.6Z"/><circle fill="currentColor" cx="12" cy="12" r="2.1"/></svg><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M12 5.1C7.2 5.1 3.5 7.8 1.4 12c2.1 4.2 5.8 6.9 10.6 6.9s8.5-2.7 10.6-6.9C20.5 7.8 16.8 5.1 12 5.1Z"/><circle fill="none" stroke="currentColor" stroke-width="1.7" cx="12" cy="12" r="4.3"/></svg><span>Sample</span></button><button id="open" class="primary">Open Model</button></div><input id="files" type="file" multiple hidden></header>
<main><div id="viewport"><div id="empty" hidden><div class="empty-mark" aria-hidden="true"></div><p>Drop a 3D model anywhere</p><small>GLB · GLTF · FBX · OBJ · STL · PLY · DAE · 3MF · 3DS · USDZ</small><button id="load-sample" type="button">Show the sample</button></div></div>
<aside id="controls-panel" aria-label="Model controls"><div class="panel-controls">
<details open><summary>Surface</summary>
<select id="mode" aria-label="Shading"><option value="normal">Normals</option><option value="clay">Grayscale</option><option value="vertex">Vertex colors</option><option value="raw">Unlit</option><option value="toon">Toon</option><option value="material" selected>Material</option></select><div id="hint"></div>
<details id="maps-section" class="sub"><summary>Textures</summary>
<div id="maps" class="maps" title="Texture maps shown in Material and Unlit">
<label class="check"><input type="checkbox" data-map="base" checked>Base color</label>
<label class="check"><input type="checkbox" data-map="normal" checked>Normal</label>
<label class="check"><input type="checkbox" data-map="roughness" checked>Roughness</label>
<label class="check"><input type="checkbox" data-map="metalness" checked>Metalness</label>
<label class="check"><input type="checkbox" data-map="specular" checked>Specular</label>
<label class="check"><input type="checkbox" data-map="emissive" checked>Emissive</label>
</div><div id="maps-note" class="diagnostics"></div>
</details>
<label class="check"><input id="wireframe" type="checkbox">Wireframe</label>
<label class="check"><input id="twosided" type="checkbox">Two-Sided</label>
</details>
<details id="model-info" open hidden><summary>Model</summary>
<dl id="info" class="info"></dl>
<div id="shapes-section" hidden>
<select id="shape-pick" aria-label="Blend shape"></select>
<div class="shape-row"><input id="shape-weight" type="range" min="0" max="1" step=".01" value="0" aria-label="Blend shape weight"><output id="shape-value">0.00</output></div>
<div id="shapes-note" class="diagnostics"></div>
</div>
</details>
<details><summary>Lighting</summary>
<select id="lighting" aria-label="Lighting"><option value="studio">Studio</option><option value="soft">Soft neutral</option><option value="raking">Raking light</option></select>
<label class="range-label" for="rotateLight">Direction</label><input id="rotateLight" type="range" min="-3.14159" max="3.14159" step=".02" value="0">
<label class="range-label" for="exposure">Exposure</label><input id="exposure" type="range" min=".2" max="2.5" step=".05" value="1">
</details>
<details open><summary>View</summary>
<div class="row"><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="top">Top</button><button data-view="iso">3D</button></div>
<div class="row view-actions"><button id="fit" title="Frame model (F)">Frame</button><button id="up" title="Rotate X 90 degrees">Rotate 90°</button></div>
<label class="check"><input id="grid" type="checkbox" checked>Floor grid</label>
<label class="check"><input id="spin" type="checkbox">Auto orbit</label>
<div class="row background-row"><span>Background</span><button type="button" id="background" aria-label="Background color" aria-haspopup="dialog" aria-controls="background-picker" aria-expanded="false"></button></div>
<div class="row sample-row" id="sample-section"><span>Sample</span><div class="sample-picks" id="sample-picks" role="group" aria-label="Sample shape"><button type="button" data-sample="knot" title="Trefoil Knot">A</button><button type="button" data-sample="mobius" title="Mobius Band">B</button><button type="button" data-sample="shell" title="Seashell">C</button><button type="button" data-sample="klein" title="Klein Bottle">D</button></div></div>
</details>
<div class="foot-row"><button id="reset" type="button" class="reset">Reset</button><button id="capture" class="capture">Save screenshot</button></div>
</div>
<section class="accent-picker" aria-labelledby="accent-title"><div class="accent-heading"><span id="accent-title">Accent</span><output id="accent-name" aria-live="polite"></output></div><div class="accent-swatches" id="accent-swatches" role="group" aria-label="Accent color"></div></section>
</aside></main>
<div id="timeline" role="group" aria-label="Animation" hidden><button id="anim-play" type="button" aria-pressed="false" aria-label="Play" title="Play (Space)"><svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.6v12.8c0 .8.9 1.3 1.6.8l9.6-6.4a1 1 0 0 0 0-1.6L9.6 4.8C8.9 4.3 8 4.8 8 5.6Z"/></svg><svg class="pause" viewBox="0 0 24 24" aria-hidden="true"><rect fill="currentColor" x="6.5" y="5" width="4" height="14" rx="1.2"/><rect fill="currentColor" x="13.5" y="5" width="4" height="14" rx="1.2"/></svg></button><div class="anim-clip"><select id="anim-clip" aria-label="Animation"></select></div><input id="anim-scrub" type="range" min="0" max="1" step=".001" value="0" aria-label="Animation time"><output id="anim-time">0.00 / 0.00 s</output><div class="anim-speed"><select id="anim-speed" aria-label="Playback speed"></select></div></div>
<div id="update" role="group" aria-label="Update available" hidden><button id="update-info" type="button" aria-label="What's new" aria-describedby="update-notes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="7.6" r="1.3" fill="currentColor"/><path d="M12 10.8v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><span id="update-text">Update?</span><button id="update-yes" class="primary" type="button">Yes</button><button id="update-no" type="button">No</button><div id="update-notes" role="tooltip"></div></div>
<div id="status" role="status"></div>
<div id="loading" class="card" role="status" aria-live="polite" hidden><div class="spinner" aria-hidden="true"></div><div><strong id="loading-name"></strong><span>Opening… <span id="loading-time">0s</span></span></div><button id="loading-cancel" type="button">Cancel</button></div>
<div id="error-card" class="card" role="alertdialog" aria-labelledby="error-title" aria-describedby="error-body" hidden><button id="error-close" class="card-x" type="button" aria-label="Dismiss">×</button><div class="card-mark" aria-hidden="true">!</div><h2 id="error-title"></h2><p id="error-body"></p><p id="error-detail" class="card-detail" hidden></p><button id="error-action" class="primary" type="button"></button></div><div id="drop" hidden>Drop model + companion files</div><div id="crash" hidden></div>
<dialog id="background-picker" aria-labelledby="picker-title">
<div class="picker-heading"><h2 id="picker-title">Background</h2><button id="color-close" type="button" aria-label="Close color picker">×</button></div>
<div id="color-square" tabindex="0" role="group" aria-label="Saturation and brightness"><span id="color-cursor"></span></div>
<div class="hsb-row"><label for="color-hue">H</label><input class="hsb-slider" id="color-hue" type="range" min="0" max="360" step="1" aria-label="Hue"><output class="hsb-value" id="color-h-value">0°</output></div>
<div class="hsb-row"><label for="color-saturation">S</label><input class="hsb-slider" id="color-saturation" type="range" min="0" max="100" step="1" aria-label="Saturation"><output class="hsb-value" id="color-s-value">0%</output></div>
<div class="hsb-row"><label for="color-brightness">B</label><input class="hsb-slider" id="color-brightness" type="range" min="0" max="100" step="1" aria-label="Brightness"><output class="hsb-value" id="color-v-value">0%</output></div>
<div class="picker-footer"><label class="hex-field">Hex<input id="color-hex" type="text" maxlength="7" spellcheck="false" aria-label="Hex color"></label><button id="color-reset" type="button">Reset</button></div>
</dialog>
<script src="boot.js"></script>
<script src="viewer.js"></script></body></html>
