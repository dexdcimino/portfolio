<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YapTap — moved</title>
<meta http-equiv="refresh" content="0; url=/yaptap/">
<script>
  // YapTrap was renamed YapTap (2026-10-14). Retire any old service worker
  // on this scope, then go to the new home, keeping the query (?install=1).
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { if (r.scope.indexOf('/yaptrap/') > -1) r.unregister(); });
    }).catch(function () {});
  }
  location.replace('/yaptap/' + location.search + location.hash);
</script>
</head>
<body style="background:#070907;color:#f2f7ec;font-family:system-ui,sans-serif;padding:24px;">
  YapTrap is now <b>YapTap</b> — <a href="/yaptap/" style="color:#b8ff2e;">tap here if you're not redirected</a>.
</body>
</html>
