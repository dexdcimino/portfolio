<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is load-bearing, not boilerplate: without it the
         dock's env(safe-area-inset-bottom) padding resolves to 0 on iPhone and
         the dock sits under the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#FF3668" />
    <meta name="description" content="Swipe through questions, pick a side, and see how everyone else split." />
    <!-- The installable app (Dex, 2026-10): the manifest, the icons and
         public/sw.js make /mindsplit/ a phone app of its own, the way Inko and
         DexNote are. The AI Lab card's download button opens ?install=1. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MindSplit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MindSplit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
