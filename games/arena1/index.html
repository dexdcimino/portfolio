<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- no-zoom: a movement FPS cannot survive pinch-zoom hijacking the canvas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Arena 1</title>
  <link rel="stylesheet" href="css/game.css" />
  <!-- Vendored, no CDN: the /games/* CSP is script-src 'self' 'unsafe-inline'
       blob: — a CDN load fails as a silent `BABYLON is undefined`. -->
  <script src="vendor/babylon.js"></script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <!-- Phase 4 HUD port (prototype layout: integrity, tank, flow, pips,
         altimeter, score, perf, feed, hitmark, vignettes). -->
    <div id="speedVig"></div><div id="hurtVig"></div><div id="jetVig"></div>
    <div id="xh"><div class="gap"></div></div><div id="hitmark"></div>
    <div class="panel" id="hpPanel">
      <div class="lbl">INTEGRITY</div>
      <div class="bar"><div id="hpFill"></div><div id="hpNum">100</div></div>
      <div class="lbl" style="margin-top:8px">TANK <span style="opacity:.5">· jetpack fuel</span></div>
      <div class="bar" id="fuelBar"><div id="fuelFill"></div><div id="fuelNum">100/100</div></div>
    </div>
    <div class="panel" id="flowPanel">
      <div class="lbl">FLOW · m/s</div>
      <div id="flowNum"><b>0.0</b></div>
      <div id="flowBar"><div id="flowFill"></div></div>
      <div id="pips"><div class="pip full"></div><div class="pip full"></div></div>
      <div id="alt">ALT 0m · SUMMIT 128m</div>
    </div>
    <div class="panel" id="score">POPS <b id="kills">0</b>&nbsp;&nbsp;<span style="opacity:.6">CELLS</span> <span id="cells">0</span>&nbsp;&nbsp;<span style="opacity:.6">DOWNS</span> <span id="deaths">0</span></div>
    <div class="panel" id="perf">
      <div><span id="fps">0</span> <span class="dim">FPS</span></div>
      <div class="dim"><span id="meshes">0</span> active meshes</div>
      <div class="dim">quality <span id="qual">MED</span> <span style="opacity:.6">[1/2/3]</span></div>
      <div class="dim">LOD debug <span id="lodState">off</span> <span style="opacity:.6">[L]</span></div>
    </div>
    <div id="feed"></div>
    <!-- MD 13 weapon HUD: two selectable slots bottom-centre, driven by the
         PREDICTED weapon field (same-frame on 1/2, host and net client). The
         smaller hook to the left is a grapple STATE readout, not a slot —
         offset from centre on purpose. -->
    <div id="weapons">
      <div class="wslot grap" id="wGrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M13 3v9a4.5 4.5 0 0 1-9 0v-1.5"/>
          <path d="M4 13.5l-2-2m2 2l2-2"/>
          <path d="M13 3l4 2-4 2"/>
        </svg>
      </div>
      <div class="wslot" id="wSlot0">
        <span class="wkey">1</span>
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M13.5 2 5 13.5h4.5L9 22l8.5-11.5H13z"/>
        </svg>
      </div>
      <div class="wslot" id="wSlot1">
        <span class="wkey">2</span>
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2c1.8 1.6 2.8 4.6 2.8 8l-.1 2.7 2.3 3.3h-3.4L12 19l-1.6-3H7l2.3-3.3-.1-2.7c0-3.4 1-6.4 2.8-8z"/>
          <circle cx="12" cy="9" r="1.3" fill="#170D2B"/>
          <path d="M10.2 19.6 12 23l1.8-3.4z" opacity=".7"/>
        </svg>
      </div>
    </div>
    <div id="hud-boot">ARENA 1</div>
    <!-- No title screen: the world boots live. Pointer lock still needs one
         user gesture, so this small chip invites the click and vanishes the
         moment the lock lands (full controls live in the pause menu). -->
    <div id="lockHint" class="on">CLICK FOR MOUSE LOOK &#183; ESC PAUSES</div>
  </div>
  <!-- MD 23 — CONTROLS MODAL. Pointer lock needs a user gesture and the
       browser gives no way round that, so rather than spend the gesture on a
       CLICK TO PLAY card that teaches nothing, it buys the one screen a new
       player actually reads. Any click or any keypress dismisses this AND
       acquires lock in the same action, so it is information rather than a
       gate — which is exactly why there is no "press any key" line anywhere
       in here. Telling someone to dismiss it would turn it back into one.
       The X is an affordance for anyone hunting for a close button; it is
       not the intended path and is styled not to read as one.
       A SIBLING of #hud, not a child: body.booting dims #hud as a whole, and
       the modal must not inherit the dimming it causes. -->
  <div id="controls">
    <button id="controlsX" type="button" aria-label="Close">&#215;</button>
    <div id="controlsRows">
      <div class="ctlRow"><span class="ctlAct">MOVE</span><span class="ctlKeys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span></div>
      <div class="ctlRow"><span class="ctlAct">JUMP / JETPACK</span><span class="ctlKeys"><kbd class="wide">SPACE</kbd><em>hold mid-air</em></span></div>
      <div class="ctlRow"><span class="ctlAct">DASH</span><span class="ctlKeys"><kbd class="wide">SHIFT</kbd></span></div>
      <div class="ctlRow"><span class="ctlAct">SHOOT</span><span class="ctlKeys"><kbd class="wide">LEFT CLICK</kbd></span></div>
      <div class="ctlRow"><span class="ctlAct">GRAPPLE</span><span class="ctlKeys"><kbd class="wide">RIGHT CLICK</kbd></span></div>
    </div>
  </div>
  <!-- Pause overlay: main.js's setState('paused') shows it, pausemenu.js
       fills it. Starts hidden; the menu binds no keys (main owns Escape). -->
  <div id="paused" class="hidden"></div>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/pausemenu.js"></script>
</body>
</html>
