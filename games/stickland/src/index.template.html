<!DOCTYPE html>
<!--@@INJECT:GENERATED_BANNER@@-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stick Figure — Open World</title>
<!-- Inline stick figure, so the page ships no image files and never 404s -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%2368d121' stroke-width='2.5' stroke-linecap='round'%3E%3Ccircle cx='16' cy='7' r='4'/%3E%3Cpath d='M16 11v10M16 14l-6 4M16 14l6 4M16 21l-5 7M16 21l5 7'/%3E%3C/g%3E%3C/svg%3E">
<script>
  /* Refresh-to-home (MD 14): reloading the game when it is the top-level page
     (a direct /games/... URL) bounces to the portfolio home, matching the
     /stickland wrapper. Inside the wrapper's iframe the parent handles it,
     and file:// dev builds always stay put. */
  (function () {
    try {
      if (window.top !== window) return;
      if (location.protocol === 'file:') return;
      var nav = performance.getEntriesByType('navigation')[0];
      if (nav && nav.type === 'reload') location.replace('/');
    } catch (e) {}
  })();
</script>
<!-- No webfont (MD 13): the games/ folder contract forbids external network
     calls, so 'Outfit' in --fn is inert and every browser uses the system
     stack (system-ui / Segoe UI / Roboto / ...). Verified against the HUD,
     inventory, pause menu, chat and cosmetics panels. Do not base64-embed
     a font and do not re-add a hotlink. -->
<style>
  /* ── Host-site tokens the game reads. On the portfolio site these come from
       the site's own accent picker; getAccent() in src/accent.js reads --accent. ── */
  :root{
    --accent:#68d121;
    --fn:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    /* Surfaces, light to dark: bg is the page, bg2 panels, bg3 raised,
       bg4 hover/active. The game reads all four. */
    --bg:#0e0f11; --bg2:#17191c; --bg3:#1f2226; --bg4:#2a2e33;
    --bdr:#2a2d31;
    --tx:#e8eaed; --tx2:#a8adb4; --tx3:#6d737b;
    --ease:.18s cubic-bezier(.2,.8,.3,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);
            color:var(--tx);font-family:var(--fn);-webkit-font-smoothing:antialiased}
  #char-overlay{position:fixed;inset:0;z-index:150;pointer-events:none}
</style>
<!-- src/game.css, inlined by build.mjs -->
<style>
@@INJECT:GAME_CSS@@
</style>
</head>
<body>

<!-- ═══════════════ PLAYROOM ═══════════════ -->
<canvas id="world-canvas" style="display:none;position:fixed;inset:0;z-index:10;pointer-events:none;"></canvas>
<canvas id="world-front-canvas" style="display:none;position:fixed;inset:0;z-index:200;pointer-events:none;"></canvas>

<!-- Game HUD — bottom center -->
<div id="game-hud" style="display:none">
  <!-- Charge bar (bow draw) — above health/stamina so it never covers the hotbar -->
  <div id="hud-charge-wrap">
    <div id="hud-charge-bar"></div>
  </div>
  <!-- Tank boost / stamina bar -->
  <div id="hud-stamina-wrap">
    <div id="hud-stamina-bar"></div>
  </div>
  <!-- Health bar -->
  <div id="hud-health-wrap">
    <div id="hud-health-bar"></div>
  </div>
  <!-- Equip slots. #item-bar-name (MD 14): weapon name, fades in above the
       bar on slot hover or on 1-4 equip; character.js drives it. -->
  <div id="item-bar">
    <div id="item-bar-name" aria-hidden="true"></div>
    <!-- Tank missile (MD 20) — the one ability while driving. playmode
         toggles .tank-mode on #item-bar: slots 1-4 hide, this double-wide
         chip shows. Bag and cosmetics stay. Display-only: the mouse fires,
         same as on foot. -->
    <div class="item-slot item-slot-missile" id="tank-missile" data-tip="Missile — click to fire" aria-hidden="true">
      <div class="item-slot-icon">
        <svg viewBox="0 0 44 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <!-- body -->
          <rect x="14" y="6.4" width="15" height="7.2" rx="3.6"/>
          <!-- nose cone -->
          <path d="M29 6.4 Q37 10 29 13.6"/>
          <!-- tail fins -->
          <path d="M14 6.4 L10 3 L11.5 10 L10 17 L14 13.6"/>
          <!-- exhaust -->
          <line x1="8" y1="10" x2="4" y2="10" opacity="0.6"/>
          <line x1="7" y1="7" x2="4.6" y2="6.2" opacity="0.35"/>
          <line x1="7" y1="13" x2="4.6" y2="13.8" opacity="0.35"/>
        </svg>
      </div>
    </div>
    <div class="item-slot active" data-slot="1" data-tip="Slot 1">
      <span class="item-slot-num">1</span>
      <div class="item-slot-icon"></div>
    </div>
    <div class="item-slot" data-slot="2" data-tip="Slot 2">
      <span class="item-slot-num">2</span>
      <div class="item-slot-icon"></div>
    </div>
    <div class="item-slot" data-slot="3" data-tip="Slot 3">
      <span class="item-slot-num">3</span>
      <div class="item-slot-icon"></div>
    </div>
    <div class="item-slot" data-slot="4" data-tip="Slot 4">
      <span class="item-slot-num">4</span>
      <div class="item-slot-icon"></div>
    </div>
    <div class="item-slot item-slot-inventory" data-slot="5" data-tip="Inventory (5/B/I)">
      <span class="item-slot-num">5</span>
      <div class="item-slot-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      </div>
    </div>
    <!-- Cosmetics — slot 6 (MD 07): a circular peer of the backpack, built
         the same way (.item-slot + modifier), one step further right. Top
         hat icon adapted from the DXAV tophat chip. Opens #dxav-panel
         anchored above; 6 and G toggle it (MD 10). No data-slot, so
         slot-key logic ignores it. -->
    <div class="item-slot item-slot-cosmetics" id="cosmetics-btn" data-tip="Cosmetics (6/G)" role="button" aria-label="Cosmetics">
      <span class="item-slot-num">6</span>
      <div class="item-slot-icon">
        <svg width="22" height="22" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="1" width="8" height="10" rx="1"/><line x1="4" y1="11" x2="20" y2="11"/><line x1="8" y1="8" x2="16" y2="8" opacity="0.6"/></svg>
      </div>
    </div>
  </div>
</div>
<!-- Platformer height/stars readout (MD11) — top-center, platformer mode
     only. Lives OUTSIDE #game-hud: that element carries a CSS transform,
     which would make it the containing block for a position:fixed child. -->
<div id="plat-stats" style="display:none"></div>

<!-- Inventory grid (4x4, hidden by default) -->
<div id="inventory-grid" style="display:none">
  <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
  <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
  <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
  <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
</div>

<!-- The Backpack (MD 16b) — one solid panel in the cosmetics customizer's
     styling, four columns above their hotbar slots (1-4). Heading and
     name line reuse the cosmetics classes so the type matches exactly.
     character.js renders the cells and drives the title; the #inv2 id
     keeps the toggle/open wiring unchanged. -->
<div id="inv2" aria-hidden="true">
  <div class="dxav-heading">Backpack</div>
  <div class="dxav-sub" id="bp-title"></div>
  <div id="bp-row">
    <div class="bp-col" data-slot="1">
      <button class="bp-chev bp-chev-up" type="button" aria-label="Previous item" data-dir="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,15 12,9 18,15"/></svg>
      </button>
      <div class="bp-cells"></div>
      <button class="bp-chev bp-chev-down" type="button" aria-label="Next item" data-dir="1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,9 12,15 18,9"/></svg>
      </button>
    </div>
    <div class="bp-col" data-slot="2">
      <button class="bp-chev bp-chev-up" type="button" aria-label="Previous item" data-dir="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,15 12,9 18,15"/></svg>
      </button>
      <div class="bp-cells"></div>
      <button class="bp-chev bp-chev-down" type="button" aria-label="Next item" data-dir="1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,9 12,15 18,9"/></svg>
      </button>
    </div>
    <div class="bp-col" data-slot="3">
      <button class="bp-chev bp-chev-up" type="button" aria-label="Previous item" data-dir="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,15 12,9 18,15"/></svg>
      </button>
      <div class="bp-cells"></div>
      <button class="bp-chev bp-chev-down" type="button" aria-label="Next item" data-dir="1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,9 12,15 18,9"/></svg>
      </button>
    </div>
    <div class="bp-col" data-slot="4">
      <button class="bp-chev bp-chev-up" type="button" aria-label="Previous item" data-dir="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,15 12,9 18,15"/></svg>
      </button>
      <div class="bp-cells"></div>
      <button class="bp-chev bp-chev-down" type="button" aria-label="Next item" data-dir="1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,9 12,15 18,9"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="play-mode-ui">
  <span id="play-mode-coords"></span>
</div>
<div id="play-connection-hud" style="display:none;position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:206;font-family:var(--fn);font-size:12px;align-items:center;gap:8px;pointer-events:none;">
  <span id="play-status" style="color:var(--tx3);"></span>
  <span id="play-latency" style="color:#5AAA72;"></span>
</div>

<!-- Chat pickers — JS populates these. Ported from _reference/. -->
<div id="ic-cmd-pick"></div>
<div id="emoji-pick"></div>

<!-- ═══════════════ COSMETICS (DXAV) ═══════════════
     Re-homed out of the notes-app account dropdown into a standalone
     in-game panel. Same #dxav-* ids so character.js wiring is unchanged.
     Opened with C (or the gear button injected by character.js). -->
<!-- MD 10 (issue 7): cosmetics-only. No tab strip, no hotbar/equip row —
     inventory belongs to the backpack. Large title + live subtext + chips. -->
<div id="dxav-panel" style="display:none">
  <div class="dxav-heading">Cosmetics</div>
  <div class="dxav-sub" id="dxav-title"></div>
  <div class="dxav-content" id="dxav-content"></div>
</div>

<!-- Photon SDK (vendor) is NOT embedded or loaded here. _ensurePhoton() in
     playmode.js injects it on demand, and only when MULTIPLAYER = true in
     src/config.js — so the default build fetches nothing beyond the font. -->

<!-- Module bootstrap, injected by build.mjs. Runs at end of body so the DOM
     above exists before main.js boots. -->
<script>
@@INJECT:BOOTSTRAP_JS@@
</script>
</body>
</html>
