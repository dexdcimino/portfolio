<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131f38"/><stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="person" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aac9f2"/><stop offset="1" stop-color="#5d86c6"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.38" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#fdf6d8"/><stop offset="1" stop-color="#e6d194"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <g fill="#ffffff">
    <circle cx="76" cy="88" r="3" opacity=".55"/><circle cx="150" cy="52" r="2.2" opacity=".35"/>
    <circle cx="448" cy="70" r="2.6" opacity=".45"/><circle cx="486" cy="180" r="2" opacity=".3"/>
    <circle cx="52" cy="220" r="2.2" opacity=".3"/><circle cx="420" cy="420" r="2.4" opacity=".3"/>
    <circle cx="90" cy="420" r="2" opacity=".25"/><circle cx="330" cy="56" r="2" opacity=".3"/>
  </g>
  <!-- back of the orbit ring -->
  <g transform="rotate(-16 256 226)">
    <path d="M 84 226 A 172 54 0 0 1 428 226" fill="none" stroke="#35e0c8" stroke-width="17" stroke-linecap="round"/>
    <circle cx="392" cy="193" r="37" fill="#ffffff" opacity=".07"/>
    <circle cx="392" cy="193" r="24" fill="url(#moon)"/>
    <circle cx="384" cy="186" r="5" fill="#d9c88f" opacity=".65"/>
    <circle cx="399" cy="201" r="4" fill="#d9c88f" opacity=".55"/>
    <circle cx="402" cy="184" r="3" fill="#d9c88f" opacity=".5"/>
  </g>
  <!-- the person -->
  <path d="M 104 512 L 104 472 C 104 392 170 338 256 338 C 342 338 408 392 408 472 L 408 512 Z" fill="url(#person)"/>
  <circle cx="256" cy="226" r="78" fill="url(#person)"/>
  <!-- eyes, glancing up at the moon -->
  <circle cx="241" cy="215" r="6.5" fill="#0b1830"/>
  <circle cx="281" cy="215" r="6.5" fill="#0b1830"/>
  <!-- front of the orbit ring -->
  <g transform="rotate(-16 256 226)">
    <path d="M 84 226 A 172 54 0 0 0 428 226" fill="none" stroke="#35e0c8" stroke-width="17" stroke-linecap="round"/>
  </g>
</svg>
