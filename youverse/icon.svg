<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131f38"/><stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="person" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aac9f2"/><stop offset="1" stop-color="#5d86c6"/>
    </linearGradient>
    <linearGradient id="ringMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff5e2"/><stop offset=".45" stop-color="#35e0c8"/><stop offset="1" stop-color="#1d9e8a"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.38" cy="0.35" r="0.95">
      <stop offset="0" stop-color="#fdf6d8"/><stop offset="1" stop-color="#e6d194"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <g fill="#ffffff">
    <circle cx="70" cy="80" r="3" opacity=".55"/><circle cx="150" cy="48" r="2.2" opacity=".35"/>
    <circle cx="452" cy="66" r="2.6" opacity=".45"/><circle cx="488" cy="200" r="2" opacity=".3"/>
    <circle cx="46" cy="240" r="2.2" opacity=".3"/><circle cx="430" cy="430" r="2.4" opacity=".3"/>
    <circle cx="84" cy="430" r="2" opacity=".25"/><circle cx="330" cy="52" r="2" opacity=".3"/>
  </g>

  <!-- RING, BACK HALVES (behind the person): three bands, real Saturn structure -->
  <g transform="rotate(-20 256 266)">
    <path d="M 60 266 A 196 66 0 0 1 452 266 L 440 266 A 184 60 0 0 0 72 266 Z" fill="#35e0c8" opacity=".30"/>
    <path d="M 78 266 A 178 60 0 0 1 434 266 L 408 266 A 152 50 0 0 0 104 266 Z" fill="url(#ringMain)" opacity=".62"/>
    <path d="M 93 266 A 163 55 0 0 1 419 238" fill="none" stroke="#0a1526" stroke-width="3.5" opacity=".45"/>
    <path d="M 110 266 A 146 48 0 0 1 402 266 L 390 266 A 134 44 0 0 0 122 266 Z" fill="#35e0c8" opacity=".38"/>
  </g>

  <!-- THE PERSON: stylized head, neck, short dynamic bust (no eyes) -->
  <g transform="translate(0 34)"><path d="M 236 266 L 276 266 L 284 362 L 228 362 Z" fill="#54749f"/>
  <g transform="translate(0 -28)"><path d="M 92 512 L 92 496 C 96 442 128 412 178 394 L 226 377 C 241 372 246 360 256 360 C 266 360 271 372 286 377 L 334 394 C 384 412 416 442 420 496 L 420 512 Z" fill="url(#person)"/></g>
  <path d="M 256 124 C 302 124 328 156 328 200 C 328 230 315 254 298 271 C 284 285 270 291 256 291 C 242 291 228 285 214 271 C 197 254 184 230 184 200 C 184 156 210 124 256 124 Z" fill="url(#person)"/>
  <path d="M 201 178 C 199 151 215 134 236 127 C 218 141 207 157 201 178 Z" fill="#e6f0fd" opacity=".5"/></g>

  <!-- RING, FRONT HALVES (in front of the person): brighter, main band split by the Cassini gap -->
  <g transform="rotate(-20 256 266)">
    <path d="M 60 266 A 196 66 0 0 0 452 266 L 440 266 A 184 60 0 0 1 72 266 Z" fill="#35e0c8" opacity=".45"/>
    <path d="M 78 266 A 178 60 0 0 0 434 266 L 408 266 A 152 50 0 0 1 104 266 Z" fill="url(#ringMain)"/>
    <path d="M 93 266 A 163 55 0 0 0 419 238" fill="none" stroke="#0a1526" stroke-width="3.5" opacity=".55"/>
    <path d="M 110 266 A 146 48 0 0 0 402 266 L 390 266 A 134 44 0 0 1 122 266 Z" fill="#35e0c8" opacity=".55"/>
  </g>

  <!-- THE MOON: bigger, riding in the foreground -->
  <circle cx="404" cy="206" r="56" fill="#ffffff" opacity=".07"/>
  <circle cx="404" cy="206" r="37" fill="url(#moon)"/>
  <circle cx="392" cy="194" r="7" fill="#d9c88f" opacity=".65"/>
  <circle cx="414" cy="216" r="5.5" fill="#d9c88f" opacity=".55"/>
  <circle cx="416" cy="190" r="4" fill="#d9c88f" opacity=".5"/>
  <circle cx="396" cy="220" r="3.4" fill="#d9c88f" opacity=".45"/>
</svg>
